name: Build Blender Extension Repository

on:
  push:
    tags:
      - v*
    workflow_dispatch:

# Required for publishing to gh-pages
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create add-on ZIP archive
        run: |
          VERSION="${{ github.ref_name }}"

          mkdir -p /tmp/DPM
          cp -r src/* /tmp/DPM/
          
          cd /tmp
          zip -r DPM-${VERSION}.zip DPM
          
          mkdir $GITHUB_WORKSPACE/dist/
          mv DPM-${VERSION}.zip $GITHUB_WORKSPACE/dist/
         
          echo "ZIP_PATH=dist/DPM-${VERSION}.zip" >> $GITHUB_ENV
          echo "Created ZIP: DPM-${VERSION}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
