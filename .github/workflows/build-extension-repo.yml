name: Build Blender Extension Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for publishing to gh-pages
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Derive version identifier
        id: version
        run: |
          # For now, use short commit SHA as version identifier
          # TODO: Change to semantic versioning or git tags in the future
          # Example: VERSION=$(git describe --tags --always)
          VERSION=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create releases directory
        run: |
          mkdir -p public/releases
      
      - name: Create add-on ZIP archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The add-on code is in the 'src' directory
          # We need to rename it to match the expected structure for Blender
          # Create a temporary directory with the proper name
          mkdir -p /tmp/DPM
          cp -r src/* /tmp/DPM/
          
          # Create the ZIP archive from the temporary directory
          cd /tmp
          zip -r DPM-${VERSION}.zip DPM
          
          # Move the ZIP to the releases directory
          mv DPM-${VERSION}.zip $GITHUB_WORKSPACE/public/releases/
          
          echo "Created ZIP: DPM-${VERSION}.zip"
          ls -lh $GITHUB_WORKSPACE/public/releases/